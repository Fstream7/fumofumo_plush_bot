web:
  host: 127.0.0.1
models:
  fumobot_db_daily:
    schedule:
      # At 0:00 everyday.
      cron: "0 0 * * *"
    storages:
      cloudflare_r2:
        type: r2
        bucket: $BACKUP_CF_BUCKET
        path: daily/
        account_id: $BACKUP_CF_ACCOUNT_ID
        access_key_id: $BACKUP_CF_KEY_ID
        secret_access_key: $BACKUP_CF_KEY
        keep: 90
      local:
        type: local
        keep: 30
        path: /root/backups
    compress_with:
      type: tgz
    databases:
      fumobot_db:
        type: postgresql
        host: $POSTGRES_HOST
        port: $POSTGRES_PORT
        database: $POSTGRES_DB
        username: $POSTGRES_USER
        password: $POSTGRES_PASSWORD
    notifiers:
      telegram:
        type: telegram
        chat_id: $ADMIN_CHAT_ID
        token: $TELEGRAM_BOT_TOKEN
        on_success: false
  fumobot_weekly:
    schedule:
      # At 12:00 on Sunday.
      cron: "0 12 * * sun"
    storages:
      cloudflare_r2:
        type: r2
        bucket: $BACKUP_CF_BUCKET
        path: weekly/
        account_id: $BACKUP_CF_ACCOUNT_ID
        access_key_id: $BACKUP_CF_KEY_ID
        secret_access_key: $BACKUP_CF_KEY
        keep: 3
    compress_with:
      type: tgz
    databases:
      fumobot_db:
        type: postgresql
        host: $POSTGRES_HOST
        port: $POSTGRES_PORT
        database: $POSTGRES_DB
        username: $POSTGRES_USER
        password: $POSTGRES_PASSWORD
    archive:
      includes:
        - /var/media
    notifiers:
      telegram:
        type: telegram
        chat_id: $ADMIN_CHAT_ID
        token: $TELEGRAM_BOT_TOKEN