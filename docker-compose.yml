# for production
# postgres to store data, redis for states
services:
  db:
    image: postgres:15-alpine
    restart: always
    networks:
      - backend
    volumes:
      - "/var/lib/postgres:/var/lib/postgresql/data"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data

  telegram_bot:
    image:  ghcr.io/fstream7/fumofumo_plush_bot:main
    restart: always
    volumes:
      - "media:/app/media:rw"
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      - backend
    depends_on:
      - db
      - redis
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - HASH_SALT=${HASH_SALT:-}
      - TIMEZONE=${TIMEZONE:-}
      - REDIS_URI=redis://redis:6379/0
      - DATABASE_URI=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}

  redis:
    image: redis:8.4.2-alpine
    hostname: redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5s
    networks:
      - backend
    volumes:
      - redis:/data

  backup:
    image: huacnlee/gobackup:v2.14.0
    restart: always
    volumes:
      - "media:/var/media:ro"
      - "backups:/root/backups:rw"
      - "./gobackup/:/etc/gobackup/:rw"
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      - backend
    depends_on:
      - db
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}

networks:
  backend:

volumes:
  media:
  backups:
  redis:
