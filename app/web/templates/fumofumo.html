{% extends "base.html" %}

{% block title %}{{ name }} - Fumofumo{% endblock %}

{% block head %}
<!--
  mathboy edit to allow the browser to cache the css
  -> call /static/fumofumo.css via link tag
-->
    <link rel="stylesheet" href="/static/fumofumo.css">
{% endblock %}

{% block content %}
    <div class="fumo-page">
        <h1>Your Fumo of the Day</h1>

        <img src="{{ url_for('media', path='/photos/' + image) }}" alt="Fumo">

        <h2>
            <a href="{{ link }}" class="text-xl font-semibold">
                {{ name }}
            </a>
        </h2>

        <p>
            <a href="/">Back to home</a>
        </p>
    </div>
{% endblock %}
